<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>语料标注与仲裁</title>
<style>body{font:15px system-ui;max-width:1080px;margin:24px auto;padding:0 16px;background:#f6f7f9}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #bbb;border-radius:6px}button{background:#235347;color:#fff}pre{white-space:pre-wrap;max-height:360px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}</style>
<h1>语料标注与争议仲裁</h1><section><button onclick="load()">刷新状态</button><span id="pending" style="margin-left:12px;padding:4px 10px;border-radius:12px;background:#b3261e;color:#fff;font-weight:600">待复议：-</span><pre id="state"></pre></section>
<section><h2>标注与讨论</h2><div class="grid"><input id="item" type="number" placeholder="条目 ID"><input id="user" type="number" placeholder="用户 ID"><input id="label" placeholder="标签"><textarea id="comment" placeholder="备注"></textarea><input id="batch" type="number" placeholder="批次 ID"><input id="manager" type="number" placeholder="管理员 ID"></div>
<button onclick="annotate()">提交标注</button><button onclick="loadItem()">查看条目与讨论可见性</button><button onclick="disagreements()">查看分歧</button><button onclick="consistency()">一致性</button><button onclick="freeze()">冻结金标准</button><button onclick="exportGold()">导出金标准</button><pre id="result"></pre></section>
<section><h2>仲裁与回避</h2><input id="arb" type="number" placeholder="仲裁员 ID"><input id="final" placeholder="最终标签"><input id="reason" placeholder="理由至少5字"><button onclick="adjudicate()">提交仲裁</button>
<hr style="border:none;border-top:1px dashed #ccc">
<h3>登记回避</h3><input id="recused" type="number" placeholder="被回避仲裁员 ID"><input id="recReason" placeholder="回避原因（如利益关系）"><input id="handler" type="number" placeholder="处理人 ID"><button onclick="recuse()">登记回避</button>
<p style="color:#666;font-size:13px">回避后该仲裁员仍可查看材料，但提交结论会被拒绝；已有结论退回待复议，需另一位仲裁员重判。复议未结束批次不能冻结。</p>
</section>
<script>const result=document.querySelector('#result');const pendingBadge=document.querySelector('#pending');const show=x=>result.textContent=JSON.stringify(x,null,2);async function get(u){return show(await(await fetch(u)).json())}async function post(u,b){const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});show(await r.json());load()}async function load(){const data=await(await fetch('/api/state')).json();result.textContent=JSON.stringify(data,null,2);const n=data.pending_reconsider_count??0;pendingBadge.textContent='待复议：'+n;pendingBadge.style.background=n?'#b3261e':'#5f7968'}function annotate(){post('/api/annotations',{item_id:+item.value,annotator_id:+user.value,label:label.value,comment:comment.value})}function loadItem(){get('/api/items/'+item.value+'?user_id='+user.value)}function disagreements(){get('/api/batches/'+batch.value+'/disagreements')}function consistency(){get('/api/batches/'+batch.value+'/consistency')}function exportGold(){get('/api/batches/'+batch.value+'/gold')}function adjudicate(){post('/api/adjudications',{item_id:+item.value,arbitrator_id:+arb.value,final_label:final.value,reason:reason.value})}function recuse(){post('/api/recusals',{item_id:+item.value,arbitrator_id:+recused.value,reason:recReason.value,handler_id:+handler.value})}function freeze(){post('/api/batches/'+batch.value+'/freeze',{manager_id:+manager.value})}load()</script>
</html>
